org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# Incremental Kotlin compilation writes state into the project directory; off
# because one of the projects in this composite is Flutter's own Gradle plugin
# inside a read-only system install (/usr/lib/flutter on this machine).
kotlin.incremental=false

# NOTE: the matching `kotlin.project.persistent.dir` setting cannot live here —
# a project's gradle.properties is not visible to included builds, and the build
# that needs it is Flutter's own Gradle plugin inside the (root-owned) SDK
# install. It lives in ~/.gradle/gradle.properties instead; see app/README.md.

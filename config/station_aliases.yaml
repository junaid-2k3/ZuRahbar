# every other spelling that must resolve to the same station: variants printed on
# transpeshawar.pk, common Roman-Urdu spellings, and short forms riders actually
# say. `urdu` and `pashto` hold the script forms. Seeded from the operation
# schedule parse, then extended by hand.


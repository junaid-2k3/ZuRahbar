[project]
name = "zurehbar"
version = "0.1.0"
description = "Scraping and vector dataset pipeline for ZuRehbar, an AI assistant for Zu Peshawar BRT riders"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "selectolax>=0.3.21",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "networkx>=3.3",
    "qdrant-client[fastembed]>=1.12",
    "sentence-transformers>=3.0",
    "pymupdf>=1.24",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zurehbar*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
